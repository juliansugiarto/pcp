# The first sale with a real proof AND real Lightning: the RISC Zero host
# (`pcp-risc0`, guest built reproducibly in Docker) sells over two LND nodes
# on regtest (bitcoind + LND in Docker, `.github/lnd-regtest/up.sh`).
# Results go to the `ci-results-lnd` branch under `real-sale/<UTC ts>/` and
# to workflow artifacts, never to main.
#
# Regtest sats only. Proving here is a test on public example inputs; a real
# seller proves on their own machine (SPEC: proving must be local).
name: real-sale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pcp/src/**"
      - "pcp-risc0/**/*.rs"
      - "pcp-risc0/**/Cargo.*"
      - ".github/lnd-regtest/**"
      - "pcp/tools/crash-matrix.sh"
      - ".github/workflows/real-sale.yml"

permissions:
  contents: write

concurrency:
  group: real-sale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-sale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LND_IMAGE: lightninglabs/lnd:v0.21.4-beta@sha256:04d06edcc0f6e99a5e797ea34959f330add222226f840cd86afbc31f8f29627d
      BTC_IMAGE: polarlightning/bitcoind:28.0@sha256:ff435d758c89f01823924e057d5d5e4206d350ae69dff5e0dc1bbc9c6a36d010
      OUT: out
      CREDS: creds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Machine
        run: |
          mkdir -p out
          { echo "date: $(date -u +%FT%TZ)"; echo "commit: $GITHUB_SHA"; uname -a; nproc; free -m;
            docker --version; rustc --version; echo "LND_IMAGE=$LND_IMAGE"; echo "BTC_IMAGE=$BTC_IMAGE"; } | tee out/machine.txt
      - name: Install RISC Zero toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The installer is fetched, hashed and kept with the results; the
          # components are pinned to the versions CI used on 22 October 2026
          # (risc0-zkvm 3.0.6), instead of "latest".
          curl -sSfL https://risczero.com/install -o rzup-install.sh
          sha256sum rzup-install.sh | tee out/rzup-installer-sha256.txt
          # The installer every recorded run fetched (22 October); a changed one fails here.
          echo "5699878af779351ec0f931fa84c3d5e35263279f66bd915af225f530a77341bf  rzup-install.sh" | sha256sum -c -
          bash rzup-install.sh
          export PATH="$HOME/.risc0/bin:$PATH"
          # rzup install has failed silently before (risc0-image-id run
          # 39614440446, docker-1: "Installed components:" empty, then
          # "Risc Zero Rust toolchain not found"). Retry until rust and r0vm
          # are listed.
          ok=""
          for i in 1 2 3 4; do
            { rzup install rust 1.97.0 && rzup install cpp 2024.1.5 && rzup install r0vm 3.0.6 && rzup install cargo-risczero 3.0.6; } > out/rzup-install-$i.txt 2>&1 || true
            tail -n 20 out/rzup-install-$i.txt
            rzup show 2>&1 | tee out/rzup-show.txt
            if grep -A1 -x r0vm out/rzup-show.txt | grep -q '3\.0\.6' && grep -A1 -x rust out/rzup-show.txt | grep -q '1\.97\.0'; then ok=1; break; fi
            sleep $((i * 20))
          done
          [ -n "$ok" ] || { echo "rzup install failed"; exit 1; }
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
      # Cache the cargo registry and pcp-risc0/target between iterations.
      # The image id is re-read and compared on every run, so a stale guest
      # would show up as a mismatch.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pcp-risc0/target
          key: real-sale-${{ runner.os }}-${{ hashFiles('pcp-risc0/Cargo.lock', 'pcp-risc0/methods/guest/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: real-sale-${{ runner.os }}-${{ hashFiles('pcp-risc0/Cargo.lock', 'pcp-risc0/methods/guest/Cargo.lock') }}-
      - name: Build pcp-risc0 --features lnd,http (guest in Docker)
        run: |
          cd pcp-risc0
          # The pinned image id (IMAGE-ID.md): what the verify-only buyer
          # accepts and what risc0-image-id.yml reproduces.
          EXPECTED_IMAGE_ID=$(grep -A1 'pub const PINNED_IMAGE_ID' verify/src/lib.rs | grep -oE '[0-9a-f]{64}')
          export RISC0_USE_DOCKER=1
          echo "RISC0_USE_DOCKER=$RISC0_USE_DOCKER" | tee ../out/build-mode.txt
          set -o pipefail
          cargo build --locked --release -p methods > ../out/build-methods-full.txt 2>&1 || { tail -n 150 ../out/build-methods-full.txt; exit 1; }
          docker images --digests | grep -i risc0 | tee ../out/docker-images.txt || true
          cargo build --locked --release -p pcp-risc0-host --features lnd,http > ../out/build-host-full.txt 2>&1 || { tail -n 150 ../out/build-host-full.txt; exit 1; }
          tail -n 5 ../out/build-host-full.txt
          find target -path '*riscv32im-risc0-zkvm-elf*' -type f \( -name 'pcp-guest' -o -name 'pcp-guest.bin' \) -exec sha256sum {} \; | tee ../out/guest-elf-sha256.txt
          ./target/release/pcp-risc0 --job sudoku9 --execute-only 2>&1 | tee ../out/execute-sudoku9.txt
          id=$(grep -oE "guest image id [0-9a-f]{64}" ../out/execute-sudoku9.txt | awk '{print $4}')
          { echo "image_id: $id"; echo "expected: $EXPECTED_IMAGE_ID";
            [ "$id" = "$EXPECTED_IMAGE_ID" ] && echo "match: yes" || echo "match: NO"; } | tee ../out/image-id.txt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pcp-risc0/target
          key: real-sale-${{ runner.os }}-${{ hashFiles('pcp-risc0/Cargo.lock', 'pcp-risc0/methods/guest/Cargo.lock') }}-${{ github.run_id }}
      - name: Start regtest network
        run: bash .github/lnd-regtest/up.sh 2>&1 | tee out/setup.txt
      - name: Sales over LND with real proofs
        id: sale
        continue-on-error: true
        run: |
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/alice/admin.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/bob/admin.macaroon
          export RUST_BACKTRACE=1
          bash .github/lnd-regtest/sale-state.sh before-sudoku9
          set -o pipefail
          rc=0
          timeout 900 /usr/bin/time -v ./pcp-risc0/target/release/pcp-risc0 --job sudoku9 --rail lnd 2>&1 \
            | while IFS= read -r l; do printf '[%s] %s\n' "$(date -u +%H:%M:%S)" "$l"; done | tee out/sale-sudoku9.txt || rc=$?
          bash .github/lnd-regtest/sale-state.sh after-sudoku9
          grep -h "cost-row" out/sale-sudoku9.txt | sed 's/^\[[0-9:]*\] //' | tee out/cost-row-sudoku9.txt || true
          [ "$rc" = 0 ] || { echo "sudoku9 sale exit $rc"; exit 1; }
          rc=0
          timeout 900 /usr/bin/time -v ./pcp-risc0/target/release/pcp-risc0 --job testsuite --rail lnd 2>&1 \
            | while IFS= read -r l; do printf '[%s] %s\n' "$(date -u +%H:%M:%S)" "$l"; done | tee out/sale-testsuite.txt || rc=$?
          bash .github/lnd-regtest/sale-state.sh after-testsuite
          grep -h "cost-row" out/sale-testsuite.txt | sed 's/^\[[0-9:]*\] //' | tee out/cost-row-testsuite.txt || true
          [ "$rc" = 0 ] || { echo "testsuite sale exit $rc"; exit 1; }
      - name: Build the verify-only buyer (pcp-buy-risc0)
        run: |
          cd pcp-risc0
          set -o pipefail
          cargo build --locked --release -p pcp-risc0-verify --features lnd,http > ../out/build-verify-full.txt 2>&1 || { tail -n 150 ../out/build-verify-full.txt; exit 1; }
          tail -n 2 ../out/build-verify-full.txt
      - name: Build pcp-setup and pcp-audit
        run: |
          cd pcp
          cargo build --locked --features lnd --bins 2>&1 | tail -n 3
      - name: Two processes with real proofs (clean, seller killed after invoicing; directory, HTTP, verify-only buyer)
        id: twoproc
        continue-on-error: true
        run: |
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/alice/admin.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/bob/admin.macaroon
          export RAIL=lnd TIMEOUT=900 BIN=$PWD/pcp/target/debug
          export SELL_BIN=$PWD/pcp-risc0/target/release/pcp-risc0 SELL_PRE="--role sell"
          export BUY_BIN=$PWD/pcp-risc0/target/release/pcp-risc0 BUY_PRE="--role buy"
          set -o pipefail
          rc=0
          bash pcp/tools/crash-matrix.sh twoproc clean seller:invoice:post 2>&1 | tee out/two-process.txt || rc=1
          # Over HTTP too (SPEC 5.5, loopback): the seller loop is busy for the
          # whole proof, so the buyer's accepts get 202 and it asks again.
          WIRE=http bash pcp/tools/crash-matrix.sh twoproc-http clean seller:invoice:post 2>&1 | tee out/two-process-http.txt || rc=1
          # The verify-only buyer (pcp-buy-risc0, no RISC Zero toolchain) over
          # HTTP: a clean sale, and the same buyer pinned to another image id,
          # which must refuse the offer before anything is proven.
          other_id=$(cd pcp-risc0 && grep -A1 'pub const PINNED_IMAGE_ID' verify/src/lib.rs | grep -oE '[0-9a-f]{64}' | tr '0-9a-f' '1-9a-f0')
          BUY_BIN=$PWD/pcp-risc0/target/release/pcp-buy-risc0 BUY_PRE="" WIRE=http \
            WRONG_BACKEND_ARGS="--image-id $other_id" \
            bash pcp/tools/crash-matrix.sh twoproc-verify clean wrong-backend 2>&1 | tee out/two-process-verify.txt || rc=1
          for m in twoproc:two-process twoproc-http:two-process-http twoproc-verify:two-process-verify; do
            for d in ${m%%:*}/*/; do
              [ -d "$d" ] || continue
              n=$(basename "$d"); mkdir -p "out/${m##*:}/$n"
              cp "$d"/*.log "$d"/*.codes "$d"/audit-*.json "out/${m##*:}/$n"/ 2>/dev/null || true
            done
          done
          grep -h "prove-row\|proof verified" twoproc*/*/*.log | tee out/two-process-costs.txt || true
          # M6, minimum: the real RISC Zero receipts the buyers received before
          # paying must not contain k, the derived key or R (pcp/tools/leakcheck.py).
          python3 pcp/tools/leakcheck.py twoproc*/*/buyer/state.json 2>&1 | tee out/leakcheck.txt || rc=1
          # Seed for F8 (note 21): one real bundle as a seller sends it before
          # payment (no k, no R; leakcheck above). Its own artifact, not out/.
          mkdir -p seed
          python3 - twoproc-verify/clean/buyer/state.json seed <<'PY' || true
          import json, sys
          d = json.load(open(sys.argv[1]))["state"]["state"]
          assert d.get("state") == "delivered"
          b = d["bundle"]
          open(sys.argv[2] + "/receipt.bin", "wb").write(bytes.fromhex(b["proof"]))
          b["proof"] = ""
          json.dump(b, open(sys.argv[2] + "/bundle.json", "w"), indent=1)
          PY
          sha256sum seed/* 2>/dev/null | tee out/seed-sha256.txt || true
          exit $rc
      - name: Dump node state
        if: always()
        run: bash .github/lnd-regtest/dump.sh > out/dump.txt 2>&1 || true
      - name: Summary
        if: always()
        run: |
          { echo "sale: ${{ steps.sale.outcome }}"; echo "two processes: ${{ steps.twoproc.outcome }}"; cat out/image-id.txt 2>/dev/null;
            grep -h -E "offer accepted|SETTLED|FAILED|cost-row|Elapsed|Maximum resident" out/sale-*.txt 2>/dev/null; } | tee out/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: receipt-seed-${{ github.run_id }}
          path: seed/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-sale-${{ github.run_id }}
          path: out/
      - name: Publish results to ci-results-lnd
        if: always()
        run: |
          git config user.name "pcp-ci"
          git config user.email "ci@users.noreply.github.com"
          dest="real-sale/$(date -u +%Y%m%dT%H%M%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin +refs/heads/ci-results-lnd:refs/remotes/origin/ci-results-lnd 2>/dev/null || true
            # Keep what the branch already has (lnd/, risc0-image-id/, ...).
            git checkout -f -B ci-results-lnd origin/ci-results-lnd 2>/dev/null \
              || { git checkout -f --orphan ci-results-lnd && git rm -rq --cached .; }
            mkdir -p "$dest" && cp -r out/* "$dest"/
            # The F8 seed, once per guest (named by image id prefix).
            id8=$(grep -oE '^image_id: [0-9a-f]{8}' out/image-id.txt 2>/dev/null | cut -c11-)
            if [ -n "$id8" ] && [ -s seed/receipt.bin ] && [ ! -e "seeds/receipt-$id8.bin" ]; then
              mkdir -p seeds && cp seed/receipt.bin "seeds/receipt-$id8.bin" && cp seed/bundle.json "seeds/bundle-$id8.json"
              git add seeds
            fi
            git add real-sale && git commit -qm "real sale (risc0 + lnd regtest) run ${{ github.run_id }} $GITHUB_SHA" && git push origin ci-results-lnd && break
            sleep $((RANDOM % 20 + 5))
          done
      - name: Fail if a sale failed or the guest is not the expected one
        if: always()
        run: |
          # A sale with an unexpected image id still settles, but every
          # document quotes the expected id: treat a mismatch as a failure.
          grep -qx "match: yes" out/image-id.txt || { echo "image id mismatch"; cat out/image-id.txt; exit 1; }
          [ "${{ steps.sale.outcome }}" = success ] && [ "${{ steps.twoproc.outcome }}" = success ] || exit 1
