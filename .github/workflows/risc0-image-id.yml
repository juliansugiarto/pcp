# A reproducible RISC Zero image id: the guest built in Docker
# (RISC0_USE_DOCKER=1, see pcp-risc0/methods/build.rs) in two separate jobs,
# and once natively for comparison. Results go to the `ci-results-lnd`
# branch and to workflow artifacts, never to main.
name: risc0-image-id

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rust-toolchain.toml"
      - ".github/toolchain-guard.sh"
      - "pcp-risc0/**"
      - "pcp/src/**"
      - ".github/workflows/risc0-image-id.yml"

permissions:
  contents: write

# Never cancel a running build: the guest image id does not depend on the
# std-only code most pushes to this branch change.
concurrency:
  group: risc0-image-id-${{ github.ref }}
  cancel-in-progress: false

jobs:
  risc0-image-id:
    strategy:
      fail-fast: false
      matrix:
        build: [docker-1, docker-2, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain pin and runner image (design note 31)
        run: bash .github/toolchain-guard.sh && bash .github/toolchain-guard.sh pcp-risc0
      - name: Install RISC Zero toolchain
        run: |
          mkdir -p out
          # Pinned components (the versions CI used on 22 October 2026).
          curl -sSfL https://risczero.com/install -o rzup-install.sh
          sha256sum rzup-install.sh | tee out/rzup-installer-sha256.txt
          # The installer every recorded run fetched (22 October); a changed one fails here.
          echo "5699878af779351ec0f931fa84c3d5e35263279f66bd915af225f530a77341bf  rzup-install.sh" | sha256sum -c -
          bash rzup-install.sh
          export PATH="$HOME/.risc0/bin:$PATH"
          { rzup install rust 1.97.0 && rzup install cpp 2024.1.5 && rzup install r0vm 3.0.6 && rzup install cargo-risczero 3.0.6; } 2>&1 | tail -n 20
          rzup show 2>&1 | tee out/rzup-show.txt
          grep -A1 -x r0vm out/rzup-show.txt | grep -q '3\.0\.6' || { echo "r0vm 3.0.6 not installed"; exit 1; }
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          # Recorded, not yet pinned (note 31): the binaries rzup wrote.
          { "$HOME/.risc0/bin/rzup" --version; sha256sum "$HOME"/.risc0/bin/*; } > out/rzup-binaries.txt 2>&1 || true
      - name: Build pcp-risc0 (${{ matrix.build }})
        run: |
          cd pcp-risc0
          if [ "${{ matrix.build }}" != native ]; then export RISC0_USE_DOCKER=1; fi
          echo "RISC0_USE_DOCKER=${RISC0_USE_DOCKER:-}" | tee ../out/build-mode.txt
          curl -fsS "https://hub.docker.com/v2/repositories/risczero/risc0-guest-builder/tags?page_size=30&ordering=last_updated" \
            | jq -r '.results[] | "\(.name) \(.last_updated)"' > ../out/guest-builder-tags.txt || true
          # The digest behind the pinned tag, recorded so it can be pinned too
          # (SUPPLY-CHAIN.md, "Not pinned yet").
          curl -fsS "https://hub.docker.com/v2/repositories/risczero/risc0-guest-builder/tags/r0.1.97.0" \
            | jq -r '"r0.1.97.0 \(.digest) \(.last_updated)"' | tee ../out/guest-builder-digest.txt || true
          set -o pipefail
          # The guest first (fails fast), then the host. Full output kept.
          cargo build --locked --release -p methods > ../out/build-methods-full.txt 2>&1 || { tail -n 150 ../out/build-methods-full.txt; exit 1; }
          grep -E "Docker context|Building ELF|^#[0-9]+ (DONE|ERROR)|risc0-guest-builder" ../out/build-methods-full.txt | head -n 40 || true
          docker images --digests | grep -i risc0 | tee ../out/docker-images.txt || true
          cargo build --locked --release 2>&1 | tail -n 20 | tee ../out/build.txt
      - name: Image id and execute-only
        run: |
          cd pcp-risc0
          set -o pipefail
          ./target/release/pcp-risc0 --job sudoku9 --execute-only 2>&1 | tee ../out/execute-sudoku9.txt
          find target -path '*riscv32im-risc0-zkvm-elf*' -type f \( -name 'pcp-guest' -o -name 'pcp-guest.bin' \) -exec sha256sum {} \; | tee ../out/guest-elf-sha256.txt
          { echo "build: ${{ matrix.build }}"; echo "commit: $GITHUB_SHA"; grep "guest image id" ../out/execute-sudoku9.txt; } | tee ../out/image-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: risc0-image-id-${{ matrix.build }}-${{ github.run_id }}
          path: out/
      - name: Publish results to ci-results-lnd
        if: always()
        run: |
          git config user.name "pcp-ci"
          git config user.email "ci@users.noreply.github.com"
          dest="risc0-image-id/$(date -u +%Y%m%dT%H%M%SZ)-${{ matrix.build }}"
          for i in 1 2 3 4 5; do
            git fetch origin +refs/heads/ci-results-lnd:refs/remotes/origin/ci-results-lnd 2>/dev/null || true
            # Keep what the branch already has (lnd/ and risc0-image-id/); on a
            # fresh orphan branch, drop the source tree from the index.
            git checkout -f -B ci-results-lnd origin/ci-results-lnd 2>/dev/null \
              || { git checkout -f --orphan ci-results-lnd && git rm -rq --cached .; }
            mkdir -p "$dest" && cp -r out/* "$dest"/
            git add risc0-image-id && git commit -qm "risc0 image id ${{ matrix.build }} run ${{ github.run_id }}" && git push origin ci-results-lnd && break
            sleep $((RANDOM % 20 + 5))
          done
