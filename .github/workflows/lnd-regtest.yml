# The LND rail against real LND nodes (regtest, Docker). Results go to the
# `ci-results-lnd` branch and to workflow artifacts, never to main.
#
# Regtest sats only. The sale uses the INSECURE dev proof backend: it tests
# the Lightning rail, not the proof.
name: lnd-regtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rust-toolchain.toml"
      - ".github/toolchain-guard.sh"
      - "pcp/src/**"
      - "pcp/Cargo.*"
      - "pcp/tests/lnd_regtest.rs"
      - "pcp/tools/crash-matrix.sh"
      - ".github/lnd-regtest/**"
      - ".github/workflows/lnd-regtest.yml"

permissions:
  contents: write

concurrency:
  group: lnd-regtest-rail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lnd:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Current LND release (Docker Hub, 2026-09-30) and the previous line.
        # Images pinned by digest (as pulled by CI on 22 October 2026): a tag
        # can be re-pointed at a poisoned image, a digest cannot.
        lnd: [v0.21.4-beta, v0.19.3-beta]
        include:
          - lnd: v0.21.4-beta
            digest: sha256:04d06edcc0f6e99a5e797ea34959f330add222226f840cd86afbc31f8f29627d
          - lnd: v0.19.3-beta
            digest: sha256:b175f136c01ffe01e75eee836273dd15b21a7e2cea2bd316ea98ad3640743aaa
    env:
      LND_IMAGE: lightninglabs/lnd:${{ matrix.lnd }}@${{ matrix.digest }}
      BTC_IMAGE: polarlightning/bitcoind:28.0@sha256:ff435d758c89f01823924e057d5d5e4206d350ae69dff5e0dc1bbc9c6a36d010
      OUT: out
      CREDS: creds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain pin and runner image (design note 31)
        run: bash .github/toolchain-guard.sh
      - name: Machine
        run: |
          mkdir -p out
          { echo "date: $(date -u +%FT%TZ)"; echo "commit: $GITHUB_SHA"; uname -a; docker --version; rustc --version; } | tee out/machine.txt
      - name: Images
        run: |
          echo "LND_IMAGE=$LND_IMAGE" | tee out/images.txt
          echo "BTC_IMAGE=$BTC_IMAGE" | tee -a out/images.txt
      - name: Build lnd_sale and tests
        run: |
          cd pcp
          set -o pipefail
          cargo build --locked --features lnd,http --bins 2>&1 | tail -n 5
          cargo test --locked --features lnd,http --no-run 2>&1 | tail -n 5
          cargo test --locked --features lnd,http 2>&1 | grep -E "^test |test result" | tee ../out/cargo-test-lnd.txt
      - name: Start regtest network
        run: bash .github/lnd-regtest/up.sh 2>&1 | tee out/setup.txt
      - name: Sale over LND (lnd_sale)
        id: sale
        continue-on-error: true
        run: |
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/alice/admin.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/bob/admin.macaroon
          set -o pipefail
          timeout 300 ./pcp/target/debug/lnd_sale 2>&1 | tee out/lnd-sale.txt
      - name: Rail tests against the nodes (lnd_regtest, ignored tests)
        id: railtests
        continue-on-error: true
        run: |
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/alice/admin.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/bob/admin.macaroon
          set -o pipefail
          cd pcp
          timeout 600 cargo test --locked --features lnd,http --test lnd_regtest -- --ignored --test-threads=1 2>&1 | tee ../out/lnd-regtest-tests.txt
      - name: Two processes over LND, killed and restarted (crash matrix)
        id: matrix
        continue-on-error: true
        run: |
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/alice/admin.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/bob/admin.macaroon
          export RAIL=lnd TIMEOUT=150
          # buyer-node-down: stop the buyer's node (alice), later start it and
          # wait until its channel to bob is active again.
          export BUYER_NODE_STOP="docker stop alice"
          export BUYER_NODE_START='docker start alice; for i in $(seq 120); do n=$(docker exec alice lncli --network=regtest listchannels --active_only 2>/dev/null | jq ".channels | length" 2>/dev/null); [ "${n:-0}" -ge 1 ] && break; sleep 1; done; echo "alice active channels: ${n:-0}"'
          set -o pipefail
          bash pcp/tools/crash-matrix.sh matrix 2>&1 | tee out/crash-matrix.txt
      - name: The same over HTTP (SPEC 5.5, loopback)
        id: matrix_http
        continue-on-error: true
        run: |
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/alice/admin.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/bob/admin.macaroon
          export RAIL=lnd WIRE=http TIMEOUT=150
          export BUYER_NODE_STOP="docker stop alice"
          export BUYER_NODE_START='docker start alice; for i in $(seq 120); do n=$(docker exec alice lncli --network=regtest listchannels --active_only 2>/dev/null | jq ".channels | length" 2>/dev/null); [ "${n:-0}" -ge 1 ] && break; sleep 1; done; echo "alice active channels: ${n:-0}"'
          set -o pipefail
          bash pcp/tools/crash-matrix.sh matrix-http 2>&1 | tee out/crash-matrix-http.txt
      - name: Least-privilege macaroons (what sale-window.yml and RUN-SIGNET.md use)
        id: leastpriv
        continue-on-error: true
        run: |
          # Seller: its node id, its own invoices, decoding them. Buyer: its node id and payments.
          docker exec bob lncli --network=regtest bakemacaroon --save_to /tmp/seller.macaroon info:read invoices:read invoices:write offchain:read
          docker exec alice lncli --network=regtest bakemacaroon --save_to /tmp/buyer.macaroon info:read offchain:read offchain:write
          mkdir -p creds/least
          docker cp bob:/tmp/seller.macaroon creds/least/seller.macaroon
          docker cp alice:/tmp/buyer.macaroon creds/least/buyer.macaroon
          export PCP_BUYER_LND_REST_URL=https://127.0.0.1:8081
          export PCP_BUYER_LND_TLS_CERT=$PWD/creds/alice/tls.cert
          export PCP_BUYER_LND_MACAROON=$PWD/creds/least/buyer.macaroon
          export PCP_SELLER_LND_REST_URL=https://127.0.0.1:8082
          export PCP_SELLER_LND_TLS_CERT=$PWD/creds/bob/tls.cert
          export PCP_SELLER_LND_MACAROON=$PWD/creds/least/seller.macaroon
          export RAIL=lnd WIRE=http TIMEOUT=150
          set -o pipefail
          bash pcp/tools/crash-matrix.sh matrix-least clean seller:invoice:post buyer:pay:pre buyer-gone 2>&1 | tee out/crash-matrix-least.txt
      - name: An empty node accepts an inbound channel (the sale window's case)
        id: emptyinbound
        continue-on-error: true
        run: |
          set -o pipefail
          bash .github/lnd-regtest/empty-inbound.sh 2>&1 | tee out/empty-inbound.txt
      - name: Collect crash matrix
        if: always()
        run: |
          # Logs, exit codes and audits only: the state directories hold the
          # test agents' keys and are not published.
          cp matrix/summary.txt out/crash-matrix-summary.txt 2>/dev/null || true
          cp matrix-http/summary.txt out/crash-matrix-http-summary.txt 2>/dev/null || true
          cp matrix-least/summary.txt out/crash-matrix-least-summary.txt 2>/dev/null || true
          for m in matrix:crash-matrix matrix-http:crash-matrix-http matrix-least:crash-matrix-least; do
            for d in ${m%%:*}/*/; do
              [ -d "$d" ] || continue
              n=$(basename "$d"); mkdir -p "out/${m##*:}/$n"
              cp "$d"/*.log "$d"/*.codes "$d"/audit-*.json "$d"/setup.txt "out/${m##*:}/$n"/ 2>/dev/null || true
            done
          done
      - name: Raw REST probe (curl)
        if: always()
        continue-on-error: true
        run: bash .github/lnd-regtest/probe.sh 2>&1 | tee out/probe.txt
      - name: Dump node state
        if: always()
        run: bash .github/lnd-regtest/dump.sh > out/dump.txt 2>&1 || true
      - name: Summary
        if: always()
        run: |
          { echo "sale: ${{ steps.sale.outcome }}"; echo "rail tests: ${{ steps.railtests.outcome }}";
            echo "crash matrix: ${{ steps.matrix.outcome }}"; tail -n 1 out/crash-matrix-summary.txt 2>/dev/null;
            echo "crash matrix http: ${{ steps.matrix_http.outcome }}"; tail -n 1 out/crash-matrix-http-summary.txt 2>/dev/null;
            echo "least privilege: ${{ steps.leastpriv.outcome }}"; tail -n 1 out/crash-matrix-least-summary.txt 2>/dev/null;
            echo "empty node, inbound channel: ${{ steps.emptyinbound.outcome }}"; grep '^active' out/empty-inbound.txt 2>/dev/null;
            cat out/images.txt 2>/dev/null; } | tee out/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lnd-regtest-${{ matrix.lnd }}-${{ github.run_id }}
          path: out/
      - name: Publish results to ci-results-lnd
        if: always()
        run: |
          git config user.name "pcp-ci"
          git config user.email "ci@users.noreply.github.com"
          dest="lnd/$(date -u +%Y%m%dT%H%M%SZ)-${{ matrix.lnd }}"
          for i in 1 2 3 4 5; do
            git fetch origin +refs/heads/ci-results-lnd:refs/remotes/origin/ci-results-lnd 2>/dev/null || true
            # Keep what the branch already has (lnd/ and risc0-image-id/); on a
            # fresh orphan branch, drop the source tree from the index.
            git checkout -f -B ci-results-lnd origin/ci-results-lnd 2>/dev/null \
              || { git checkout -f --orphan ci-results-lnd && git rm -rq --cached .; }
            mkdir -p "$dest" && cp -r out/* "$dest"/
            git add lnd && git commit -qm "lnd regtest ${{ matrix.lnd }} run ${{ github.run_id }} $GITHUB_SHA" && git push origin ci-results-lnd && break
            sleep $((RANDOM % 20 + 5))
          done
      - name: Fail if the sale, the rail tests or a crash matrix failed
        if: steps.sale.outcome != 'success' || steps.railtests.outcome != 'success' || steps.matrix.outcome != 'success' || steps.matrix_http.outcome != 'success' || steps.leastpriv.outcome != 'success' || steps.emptyinbound.outcome != 'success'
        run: exit 1
