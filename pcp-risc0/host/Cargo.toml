[package]
name = "pcp-risc0-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "pcp-risc0"
path = "src/main.rs"

[features]
# Real Lightning (two LND nodes on regtest) instead of the simulated ledger.
lnd = ["pcp/lnd"]

[dependencies]
methods = { path = "../methods" }
pcp = { path = "../../pcp" }
# `default-features = false` drops the `bonsai` feature: remote proving is
# not even compiled in. A proving service would learn R and k.
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["prove"] }
bincode = "1.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
