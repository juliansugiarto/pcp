# S-D probe: can a short "sale window" run inside Actions? Checks, and only
# records, the unknowns in docs/riset/.../14_fable_jendela_jualan.md:
#   1. LND (neutrino) syncs Mutinynet (custom signet, 30 s blocks)?
#   2. LND (neutrino) syncs the default signet, and how fast?
#   3. Does the Mutinynet faucet API answer from a runner?
#   4. Does a Cloudflare quick tunnel (no account) reach a local server?
#   5. Does bore expose a TCP port?
# No PCP sale, no funds of ours, nothing left running. Manual only.
# Results go to the `ci-results` branch under window-probe/<UTC ts>/.
name: window-probe

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: window-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LND_IMAGE: lightninglabs/lnd:v0.21.4-beta@sha256:04d06edcc0f6e99a5e797ea34959f330add222226f840cd86afbc31f8f29627d
      MUTINY_CHALLENGE: 512102f7561d208dd9ae99bf497273e16f389bdbd6c4742ddb8e6b216e64fa2928ad8f51ae
      MUTINY_PEER: 45.79.52.207:38333
    steps:
      - name: Machine
        run: |
          mkdir -p out
          { echo "date: $(date -u +%FT%TZ)"; uname -a; nproc; } | tee out/machine.txt
          docker pull -q "$LND_IMAGE" | tee out/images.txt

      - name: 1. LND neutrino on Mutinynet
        continue-on-error: true
        run: |
          docker run -d --name mutiny "$LND_IMAGE" --bitcoin.signet --bitcoin.node=neutrino \
            --bitcoin.signetchallenge="$MUTINY_CHALLENGE" --neutrino.connect="$MUTINY_PEER" \
            --noseedbackup --norest --debuglevel=info
          probe() {
            for i in $(seq 1 60); do
              j=$(docker exec mutiny lncli --network=signet getinfo 2>/dev/null) || { sleep 10; continue; }
              echo "$(date -u +%T) $(echo "$j" | jq -c '{block_height, synced_to_chain, synced_to_graph}')"
              [ "$(echo "$j" | jq -r .synced_to_chain)" = true ] && return 0
              sleep 10
            done
            return 1
          }
          probe | tee out/mutinynet-sync.txt; rc=${PIPESTATUS[0]}
          echo "synced: $([ $rc = 0 ] && echo yes || echo no)" | tee -a out/mutinynet-sync.txt
          docker exec mutiny lncli --network=signet newaddress p2wkh 2>/dev/null | jq -r .address > out/mutinynet-addr.txt || true
          docker logs mutiny 2>&1 | grep -iE "error|fail|invalid|reject|difficulty|synced|height" | tail -n 60 > out/mutinynet-lnd-log.txt || true

      - name: 3. Mutinynet faucet API
        continue-on-error: true
        run: |
          addr=$(cat out/mutinynet-addr.txt 2>/dev/null)
          echo "address: ${addr:-none}" | tee out/faucet.txt
          for path in /api/onchain /api/v1/onchain; do
            code=$(curl -sS -m 30 -o out/faucet-body.txt -w '%{http_code}' -X POST \
              -H 'content-type: application/json' \
              -d "{\"sats\":10000,\"address\":\"${addr:-tb1qexample}\"}" "https://faucet.mutinynet.com$path" || echo none)
            echo "POST $path -> $code: $(head -c 300 out/faucet-body.txt)" | tee -a out/faucet.txt
          done
          sleep 90
          docker exec mutiny lncli --network=signet walletbalance 2>/dev/null | tee -a out/faucet.txt || true
          docker rm -f mutiny >/dev/null

      - name: 2. LND neutrino on the default signet
        continue-on-error: true
        run: |
          docker run -d --name signet "$LND_IMAGE" --bitcoin.signet --bitcoin.node=neutrino \
            --noseedbackup --norest --debuglevel=info
          s=$(date +%s)
          for i in $(seq 1 90); do
            j=$(docker exec signet lncli --network=signet getinfo 2>/dev/null) || { sleep 10; continue; }
            echo "$(date -u +%T) $(echo "$j" | jq -c '{block_height, synced_to_chain}')" >> out/signet-sync.txt
            [ "$(echo "$j" | jq -r .synced_to_chain)" = true ] && break
            sleep 10
          done
          tail -n 3 out/signet-sync.txt
          echo "seconds: $(( $(date +%s) - s ))" | tee -a out/signet-sync.txt
          docker logs signet 2>&1 | grep -iE "error|fail|peer|synced|height" | tail -n 40 > out/signet-lnd-log.txt || true
          docker rm -f signet >/dev/null

      - name: 4. Cloudflare quick tunnel
        continue-on-error: true
        run: |
          curl -sSfL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64
          echo "053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0  cloudflared" | sha256sum -c -
          chmod +x cloudflared && ./cloudflared --version | tee out/tunnel.txt
          mkdir -p www && echo "pcp window probe" > www/index.html
          (cd www && python3 -m http.server 8650 >/dev/null 2>&1 &)
          ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8650 > cf.log 2>&1 &
          for i in $(seq 1 30); do url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -n 1); [ -n "$url" ] && break; sleep 2; done
          echo "url found: $([ -n "$url" ] && echo yes || echo no)" | tee -a out/tunnel.txt
          sleep 10
          [ -n "$url" ] && curl -sS -m 20 "$url/" | tee -a out/tunnel.txt
          pkill cloudflared || true

      - name: 5. bore TCP tunnel
        continue-on-error: true
        run: |
          cargo install --locked bore-cli --version 0.6.0 2>&1 | tail -n 1
          bore --version | tee out/bore.txt
          (python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",9735));s.listen();c,_=s.accept();c.sendall(b"pcp-bore-ok\n")' &)
          bore local 9735 --to bore.pub > bore.log 2>&1 &
          sleep 8
          port=$(grep -oE 'bore.pub:[0-9]+' bore.log | head -n 1 | cut -d: -f2)
          echo "remote port found: $([ -n "$port" ] && echo yes || echo no)" | tee -a out/bore.txt
          [ -n "$port" ] && timeout 10 bash -c "exec 3<>/dev/tcp/bore.pub/$port; head -n 1 <&3" | tee -a out/bore.txt
          pkill bore || true

      - name: Summary
        if: always()
        run: |
          { echo "mutinynet: $(grep '^synced' out/mutinynet-sync.txt 2>/dev/null)";
            echo "signet: $(tail -n 2 out/signet-sync.txt 2>/dev/null | tr '\n' ' ')";
            echo "faucet: $(grep POST out/faucet.txt 2>/dev/null | cut -c1-120 | tr '\n' ' ')";
            echo "tunnel: $(grep -c 'pcp window probe' out/tunnel.txt 2>/dev/null) page(s) fetched";
            echo "bore: $(grep -c pcp-bore-ok out/bore.txt 2>/dev/null) line(s) read"; } | tee out/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: window-probe-${{ github.run_id }}
          path: out/
      - name: Publish results to ci-results
        if: always()
        run: |
          rm -rf www cloudflared cf.log bore.log
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git config user.name "pcp-ci"; git config user.email "ci@users.noreply.github.com"
          dest="window-probe/$(date -u +%Y%m%dT%H%M%SZ)"
          for i in 1 2 3 4 5; do
            git fetch -q origin +refs/heads/ci-results:refs/remotes/origin/ci-results && git checkout -q -f -B ci-results origin/ci-results
            mkdir -p "$dest" && cp -r ../out/* "$dest"/
            git add window-probe && git commit -qm "window probe run ${{ github.run_id }}" && git push -q origin ci-results && break
            sleep $((RANDOM % 20 + 5))
          done
