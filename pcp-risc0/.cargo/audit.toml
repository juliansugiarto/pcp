# cargo audit for the RISC Zero workspace. Every ignored advisory below was
# read on 22 October 2026 and traced with `cargo tree -i`; none is reachable
# with input from a stranger. The verify-buyer workflow fails on any other
# advisory. Re-read each one when risc0-zkvm is upgraded.
[advisories]
ignore = [
  # rsa 0.9.10, Marvin timing attack on RSA decryption. Pulled by rzup and
  # risc0-build (toolchain download and guest build tooling). PCP never
  # decrypts with RSA. Not in pcp-risc0-verify.
  "RUSTSEC-2023-0071",
  # ruzstd 0.7.3, decompression bomb. Pulled by `object`, which the prover
  # uses to read its own guest ELF. Not in pcp-risc0-verify.
  "RUSTSEC-2026-0344",
  # tracing-subscriber 0.2.25, ANSI escapes in logs of user input. Pulled by
  # ark-relations (risc0-groth16). PCP installs no tracing subscriber and
  # refuses Groth16 receipts before decoding them. In pcp-risc0-verify's tree,
  # not reachable.
  "RUSTSEC-2025-0055",
  # zip 2.6.1, three extraction issues (symlinks, permissions, SUID bits).
  # Pulled by risc0-circuit-keccak/recursion (prover side) to read the
  # archive bundled inside those crates. PCP extracts no archive from anyone.
  # Not in pcp-risc0-verify.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
